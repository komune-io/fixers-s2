name: Dev

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, synchronize, labeled, ready_for_review]
  push:
    branches:
      - main
      - 'release/*'

# Cancel only superseded pull request runs that cannot publish: PRs labeled
# 'stage' and versioning/* release PRs run the stage task, so they queue —
# like pushes, scheduled and manually dispatched runs — instead of being
# cancelled mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'stage') && !startsWith(github.head_ref, 'versioning/') }}

jobs:
  libs:
    uses: komune-io/fixers-gradle/.github/workflows/make-jvm-workflow.yml@main # NOSONAR(githubactions:S7637) org-internal reusable, tracked @main by convention
    permissions:
      contents: read
      packages: write
    with:
      make-file: 'infra/make/libs.mk'
      skip-tasks: ${{ github.actor == 'dependabot[bot]' && 'check' || '' }}
    secrets:
      FIXERS_PUBLISH_SIGNING_GPG_KEY: ${{ secrets.FIXERS_PUBLISH_SIGNING_GPG_KEY }}
      FIXERS_PUBLISH_SIGNING_GPG_KEY_PASSWORD: ${{ secrets.FIXERS_PUBLISH_SIGNING_GPG_KEY_PASSWORD }}
      FIXERS_PUBLISH_GITHUB_USERNAME: ${{ github.actor }}
      FIXERS_PUBLISH_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FIXERS_PUBLISH_MAVEN_CENTRAL_USERNAME: ${{ secrets.FIXERS_PUBLISH_MAVEN_CENTRAL_USERNAME }}
      FIXERS_PUBLISH_MAVEN_CENTRAL_PASSWORD: ${{ secrets.FIXERS_PUBLISH_MAVEN_CENTRAL_PASSWORD }}
      FIXERS_SONAR_TOKEN: ${{ secrets.FIXERS_SONAR_TOKEN }}

  sec:
    needs: libs
    uses: komune-io/fixers-gradle/.github/workflows/sec-workflow.yml@main # NOSONAR(githubactions:S7637) org-internal reusable, tracked @main by convention
    permissions:
      contents: write
      pull-requests: read
    with:
      # SonarCloud analysis runs via the Gradle sonar task in the libs check step.
      with-sonarcloud: false
    secrets:
      FIXERS_SONAR_TOKEN: ${{ secrets.FIXERS_SONAR_TOKEN }}
