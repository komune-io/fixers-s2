naming:
  PackageNaming:
    packagePattern: '[a-z0-9]+(\.[a-z][A-Za-z0-9]*)*'

complexity:
  TooManyFunctions:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: false

coroutines:
  # F2 functions and S2 deciders are suspend functions that return a Flow by design.
  SuspendFunWithFlowReturnType:
    active: false
